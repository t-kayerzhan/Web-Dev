<p>album-detail works!</p>
<div>
  <a routerLink="/albums">← Назад</a>

  <div *ngIf="loading">Загрузка...</div>

  <div *ngIf="!loading && album">
    <h2>Альбом #{{ album.id }}</h2>
    <p>{{ album.title }}</p>
    <p>User ID: {{ album.userId }}</p>
    
    <input [(ngModel)]="editedTitle">
    <button (click)="saveTitle()">Сохранить</button>
    
    <a [routerLink]="['/albums', album.id, 'photos']">📸 Фото</a>
  </div>
</div>
